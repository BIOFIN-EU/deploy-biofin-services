services:
  auth-db:
    image: postgres:16.3
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${AUTH_POSTGRES_DB}
      - POSTGRES_USER=${AUTH_POSTGRES_USER}
      - POSTGRES_PASSWORD=${AUTH_POSTGRES_PASSWORD}
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  auth-api:
    image: ghcr.io/biofin-eu/auth-api:latest
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=auth-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${AUTH_POSTGRES_DB}
      - POSTGRES_USER=${AUTH_POSTGRES_USER}
      - POSTGRES_PASSWORD=${AUTH_POSTGRES_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_HOURS=24
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID}
      - AUTH_CLIENT_SECRET=${AUTH_CLIENT_SECRET}
      - GATEWAY_AUTH_CLIENT_ID=${GATEWAY_AUTH_CLIENT_ID}
      - GATEWAY_AUTH_CLIENT_SECRET=${GATEWAY_AUTH_CLIENT_SECRET}
      - PHYSICAL_AUTH_CLIENT_ID=${PHYSICAL_AUTH_CLIENT_ID}
      - PHYSICAL_AUTH_CLIENT_SECRET=${PHYSICAL_AUTH_CLIENT_SECRET}
    ports:
      - "8010:8010"
    depends_on:
      auth-db:
        condition: service_healthy

  physical-db:
    image: postgres:16.3
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${PHYSICAL_POSTGRES_DB}
      - POSTGRES_USER=${PHYSICAL_POSTGRES_USER}
      - POSTGRES_PASSWORD=${PHYSICAL_POSTGRES_PASSWORD}
    volumes:
      - physical_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  temporal-postgres:
    image: postgres:16.3
    restart: unless-stopped
    environment:
      - POSTGRES_DB=temporal
      - POSTGRES_USER=${TEMPORAL_POSTGRES_USER}
      - POSTGRES_PASSWORD=${TEMPORAL_POSTGRES_PASSWORD}
    volumes:
      - temporal_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${TEMPORAL_POSTGRES_USER}
      - POSTGRES_PWD=${TEMPORAL_POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=temporal-postgres
      - TEMPORAL_LOG_LEVEL=warn
    depends_on:
      temporal-postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_TASK_QUEUE=case-workflow-task-queue
    depends_on:
      temporal:
        condition: service_started

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_BUCKET=case-documents
      - MINIO_SECURE=false
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  physical-api:
    image: ghcr.io/biofin-eu/physical-api:latest
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8020 --reload
    ports:
      - "8020:8020"
    environment:
      - POSTGRES_HOST=physical-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${PHYSICAL_POSTGRES_DB}
      - POSTGRES_USER=${PHYSICAL_POSTGRES_USER}
      - POSTGRES_PASSWORD=${PHYSICAL_POSTGRES_PASSWORD}
      - AUTH_URL=http://auth-api:8010
      - AUTH_CLIENT_ID=${PHYSICAL_AUTH_CLIENT_ID}
      - AUTH_CLIENT_SECRET=${PHYSICAL_AUTH_CLIENT_SECRET}
      - WORKFLOW_DB_SCHEMA=workflow
      - CASE_DATA_DB_SCHEMA=case_data
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_BUCKET=case-documents
      - MINIO_SECURE=false
    depends_on:
      physical-db:
        condition: service_healthy
      auth-api:
        condition: service_started
      temporal:
        condition: service_started
      minio:
        condition: service_healthy

  physical-worker:
    image: ghcr.io/biofin-eu/physical-api:latest
    restart: unless-stopped
    command: python -m app.workers.temporal_worker
    environment:
      - POSTGRES_HOST=physical-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${PHYSICAL_POSTGRES_DB}
      - POSTGRES_USER=${PHYSICAL_POSTGRES_USER}
      - POSTGRES_PASSWORD=${PHYSICAL_POSTGRES_PASSWORD}
      - AUTH_URL=http://auth-api:8010
      - AUTH_CLIENT_ID=${PHYSICAL_AUTH_CLIENT_ID}
      - AUTH_CLIENT_SECRET=${PHYSICAL_AUTH_CLIENT_SECRET}
      - WORKFLOW_DB_SCHEMA=workflow
      - CASE_DATA_DB_SCHEMA=case_data
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_BUCKET=case-documents
      - MINIO_SECURE=false
    depends_on:
      physical-db:
        condition: service_healthy
      auth-api:
        condition: service_started
      temporal:
        condition: service_started
      minio:
        condition: service_healthy

  gateway-api:
    image: ghcr.io/biofin-eu/gateway-api:latest
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - AUTH_URL=http://auth-api:8010
      - PHYSICAL_API_URL=http://physical-api:8020
      - AUTH_CLIENT_ID=${GATEWAY_AUTH_CLIENT_ID}
      - AUTH_CLIENT_SECRET=${GATEWAY_AUTH_CLIENT_SECRET}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - EXTRA_ALLOWED_HOSTS=${EXTRA_ALLOWED_HOSTS}
      - VIRTUAL_HOST=${VIRTUAL_HOST_GATEWAY}
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST_GATEWAY}
      - VIRTUAL_PORT=${VIRTUAL_PORT_GATEWAY}
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - http_proxy=${HTTP_PROXY}
      - https_proxy=${HTTPS_PROXY}
      - NO_PROXY=${DEFAULT_NO_PROXY}
      - no_proxy=${DEFAULT_NO_PROXY}
    depends_on:
      auth-api:
        condition: service_started
      physical-api:
        condition: service_started

  frontend-ui:
    image: ghcr.io/biofin-eu/frontend-ui:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      - EXTRA_ALLOWED_HOSTS=${EXTRA_ALLOWED_HOSTS}
      - VIRTUAL_HOST=${VIRTUAL_HOST_FRONTEND}
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST_FRONTEND}
      - VIRTUAL_PORT=${VIRTUAL_PORT_FRONTEND}
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - http_proxy=${HTTP_PROXY}
      - https_proxy=${HTTPS_PROXY}
      - NO_PROXY=${DEFAULT_NO_PROXY}
      - no_proxy=${DEFAULT_NO_PROXY}
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    depends_on:
      gateway-api:
        condition: service_started

volumes:
  physical_data:
  temporal_pg_data:
  minio_data:
  auth_data: